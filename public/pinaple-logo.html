<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PINEAPPLE Navbar & Footer Animated Logo</title>
  <!-- Google Fonts: Luxury Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables: আপনার ওয়েবসাইটের সাথে মিলিয়ে এখান থেকে সাইজ ও কালার পরিবর্তন করুন */
    :root {
      --logo-size: 2rem;       /* লোগোর সাইজ */
      --letter-spacing: 0.28em;   /* অক্ষরের মাঝের দূরত্ব */
      --logo-color: #111111;      /* টেক্সটের রঙ (সাদা ব্যাকগ্রাউন্ডের জন্য কালচে #111111 এবং কালো ব্যাকগ্রাউন্ড হলে #ffffff দিন) */
      --accent-gold: #d4af37;     /* গোল্ডেন আইকন/মার্কের রঙ */
    }

    /* Container for Demo Purpose */
    body {
      margin: 0;
      padding: 40px;
      background-color: #ffffff; /* আপনার নেভবারের মূল ব্যাকগ্রাউন্ড অনুযায়ী টেস্ট করুন */
    }

    .brand-logo-wrapper {
      background: transparent;
      display: inline-flex;
      align-items: center;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      background: transparent;
    }

    /* Geometric Accent Mark */
    .brand-mark {
      width: calc(var(--logo-size) * 0.45);
      height: calc(var(--logo-size) * 0.45);
      background: linear-gradient(135deg, var(--accent-gold), #f3e5ab);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      animation: markPulse 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      flex-shrink: 0;
    }

    /* Typography Settings */
    .brand-text {
      font-family: 'Cinzel', serif;
      font-size: var(--logo-size);
      font-weight: 700;
      color: var(--logo-color);
      letter-spacing: var(--letter-spacing);
      text-transform: uppercase;
      display: inline-flex;
      overflow: hidden;
      white-space: nowrap;
      line-height: 1;
    }

    /* Animated Individual Letter Spans */
    .brand-text .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(8px);
      filter: blur(2px);
      animation: letterReveal 6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      will-change: transform, opacity, filter;
    }

    /* Staggered Delay */
    .brand-text .char:nth-child(1) { animation-delay: 0.00s; }
    .brand-text .char:nth-child(2) { animation-delay: 0.07s; }
    .brand-text .char:nth-child(3) { animation-delay: 0.14s; }
    .brand-text .char:nth-child(4) { animation-delay: 0.21s; }
    .brand-text .char:nth-child(5) { animation-delay: 0.28s; }
    .brand-text .char:nth-child(6) { animation-delay: 0.35s; }
    .brand-text .char:nth-child(7) { animation-delay: 0.42s; }
    .brand-text .char:nth-child(8) { animation-delay: 0.49s; }
    .brand-text .char:nth-child(9) { animation-delay: 0.56s; }

    /* CSS Keyframe Animations */
    @keyframes letterReveal {
      0% {
        opacity: 0;
        transform: translateY(8px);
        filter: blur(3px);
      }
      15% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
      70% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
      85%, 100% {
        opacity: 0;
        transform: translateY(-6px);
        filter: blur(2px);
      }
    }

    @keyframes markPulse {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-45deg);
      }
      15%, 70% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
      85%, 100% {
        opacity: 0;
        transform: scale(0) rotate(45deg);
      }
    }

    /* Responsive Mobile Breakpoint */
    @media (max-width: 768px) {
      :root {
        --logo-size: 1rem;
        --letter-spacing: 0.2em;
      }
    }
  </style>
</head>
<body>

  <!-- Copy this block into your navbar or footer -->
  <div class="brand-logo-wrapper">
    <a href="/" class="brand-logo" aria-label="PINEAPPLE Home">
      <span class="brand-mark"></span>
      <span class="brand-text">
        <span class="char">P</span>
        <span class="char">I</span>
        <span class="char">N</span>
        <span class="char">E</span>
        <span class="char">A</span>
        <span class="char">P</span>
        <span class="char">P</span>
        <span class="char">L</span>
        <span class="char">E</span>
      </span>
    </a>
  </div>

</body>
</html>
